[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shap_analyzer"
version = "0.1.3"
description = "A lightweight wrapper for quick SHAP model explainability analysis."
authors = [{ name = "Abu Saad", email = "abusaadd44@gmail.com" }]
dependencies = [
    "shap>=0.42.0",
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0"
]
requires-python = ">=3.8"